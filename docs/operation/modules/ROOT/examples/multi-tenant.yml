server:
  production: true
  cors:
    enabled: true
    origins:
      - https://app.example.com
  cachecontrol: # <1>
    enabled: true
    visibility: private
    maxage: 3600
datastores: # <2>
  - name: redis
    id: tile-store
    host: redis.internal
  - name: postgresql
    id: warehouse
    host: postgres.internal
    user: tilegroxy
    password: env.POSTGRES_PASSWORD
    database: analytics
authentication:
  name: jwt
  key: env.JWT_PUBLIC_KEY # <3>
  algorithms:
    - RS256
  expectedissuer: https://auth.example.com
  tenantid: org_id # <4>
  layerscope: true # <5>
  scopeprefix: tiles/
cache:
  - id: shared # <6>
    name: redis
    datastore: tile-store
    keyprefix: shared
    ttl: 604800
  - id: per-tenant
    name: tenant # <7>
    cache:
      name: redis
      datastore: tile-store
      keyprefix: tenant
      ttl: 86400
analytics:
  name: postgresql
  datastore: warehouse
  table: tile_events
  fields: # <8>
    - tenantid
    - cached
    - duration
layers:
  - id: basemap # <9>
    provider:
      name: proxy
      url: https://tiles.example.com/basemap/{z}/{x}/{y}.png
  - id: survey
    cache: per-tenant
    provider:
      name: crop
      boundsfromauth: true # <10>
      primary:
        name: proxy
        url: https://imagery.example.com/{ctx.tenant}/survey/{z}/{x}/{y}.png # <11>
  - id: survey_on_basemap
    cache: per-tenant # <12>
    allowcoalesce: false # <13>
    provider:
      name: blend
      mode: normal
      providers:
        - name: ref
          layer: survey
        - name: ref
          layer: basemap
