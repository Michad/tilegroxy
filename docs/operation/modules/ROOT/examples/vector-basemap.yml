server:
  production: false
  cors:
    enabled: true
    wildcardorigin: true # <1>
  tilejson:
    enabled: true # <2>
client:
  maxlength: 52428800 # <3>
cache:
  name: memory
  maxsize: 10000
  ttl: 86400
layers:
  - id: overture_base
    provider:
      name: pmtiles
      url: https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com/tiles/2026-08-19.0/base.pmtiles # <4>
  - id: overture_transportation
    provider:
      name: pmtiles
      url: https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com/tiles/2026-08-19.0/transportation.pmtiles
  - id: overture_buildings
    provider:
      name: pmtiles
      url: https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com/tiles/2026-08-19.0/buildings.pmtiles
  - id: overture_basemap
    provider:
      name: compositemvt # <5>
      providers:
        - name: fallback # <6>
          primary:
            name: ref # <7>
            layer: overture_base
          secondary:
            name: static
            image: embedded:empty.mvt # <8>
        - name: fallback
          primary:
            name: ref
            layer: overture_transportation
          secondary:
            name: static
            image: embedded:empty.mvt
        - name: fallback
          primary:
            name: ref
            layer: overture_buildings
          secondary:
            name: static
            image: embedded:empty.mvt
