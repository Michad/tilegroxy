server:
  production: false
  tilejson:
    enabled: true
  cachecontrol:
    enabled: true
cache:
  name: ttl
  ttl: 2592000
  cache:
    name: disk
    path: ./imagery_cache
x-shared:
  colorado: &colorado
    north: 41.0
    south: 37.0
    west: -109.05
    east: -102.04
layers:
  - id: osm_gray
    provider:
      name: effect
      mode: grayscale
      provider:
        name: proxy
        url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  - id: colorado
    description: USDA NAIP aerial imagery of Colorado over a grayscale basemap
    attribution: USDA National Agriculture Imagery Program, © OpenStreetMap contributors
    center: [-105.55, 39.0, 7]
    client:
      timeout: 30
      unknownlength: true
    provider:
      name: fallback
      zoom: 10-21
      bounds: *colorado
      cache: unless-fallback
      primary:
        name: crop
        bounds: *colorado
        primary:
          name: proxy
          srid: 3857
          url: https://imagery.nationalmap.gov/arcgis/services/USGSNAIPImagery/ImageServer/WMSServer?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=USGSNAIPImagery:NaturalColor&STYLES=&CRS=EPSG:3857&BBOX={xmin},{ymin},{xmax},{ymax}&WIDTH=256&HEIGHT=256&FORMAT=image/jpeg
        secondary:
          name: ref
          layer: osm_gray
      secondary:
        name: ref
        layer: osm_gray
