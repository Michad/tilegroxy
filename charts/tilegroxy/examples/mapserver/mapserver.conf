# MapServer 8+ requires a config file. MS_MAP_PATTERN restricts which paths the
# map= query parameter is allowed to name, which is defense in depth behind the
# layer's paramValidator: even if a crafted layer name got through, mapserv
# will refuse to open anything outside mapfiles/.
CONFIG
    ENV
        MS_MAP_PATTERN "^mapfiles/[a-zA-Z0-9\-]+\.map$"
    END
END
