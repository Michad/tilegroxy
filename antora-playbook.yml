site:
  title: tilegroxy Docs
  # url: https://tilegroxy.com
  start_page: operation::index.adoc
content:
  sources:
  - url: .
    branches: HEAD
    start_path: docs/operation
    edit_url: ~
  - url: .
    branches: HEAD
    start_path: docs/development
    edit_url: ~
  - url: .
    branches: HEAD
    start_path: docs/decisions
    edit_url: ~
asciidoc:
  attributes:
    experimental: ''
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
    table-caption: false
    url-repo: https://github.com/Michad/tilegroxy
    tabs-sync-option: ''
  extensions:
  - '@asciidoctor/tabs'

ui:
  bundle:
    url: https://github.com/tilegroxy/antora-ui/releases/download/v3/ui-bundle.zip
    snapshot: true
  supplemental_files:
  - path: css/tabs.css
    contents: ./node_modules/@asciidoctor/tabs/dist/css/tabs.css
  - path: js/vendor/tabs.js
    contents: ./node_modules/@asciidoctor/tabs/dist/js/tabs.js
  - path: partials/head-styles.hbs
    contents: |
      <link rel="stylesheet" href="{{{uiRootPath}}}/css/site.css">
      <link rel="stylesheet" href="{{{uiRootPath}}}/css/tabs.css">
  - path: partials/footer-scripts.hbs
    contents: |
      <script id="site-script" src="{{{uiRootPath}}}/js/site.js" data-ui-root-path="{{{uiRootPath}}}"></script>
      <script async src="{{{uiRootPath}}}/js/vendor/highlight.js"></script>
      <script async src="{{{uiRootPath}}}/js/vendor/tabs.js" data-sync-storage-key="preferred-tab"></script>
      {{#if env.SITE_SEARCH_PROVIDER}}
      {{> search-scripts}}
      {{/if}}
