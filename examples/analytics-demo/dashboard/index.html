<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Analytics Demo - Map</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<style>
		html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
		body { display: flex; flex-direction: column; }
		header { padding: 0.75rem 1rem; background: #22303c; color: #fff; }
		header a { color: #8ecdf5; }
		#map { flex: 1; }
	</style>
</head>

<body>
	<header>
		Pan and zoom to generate tile requests, then watch them appear on the
		<a href="/dashboard">dashboard</a>. Switch layers with the control at the top right.
	</header>
	<div id="map"></div>
	<script>
		const tileURL = layer => '__TILE_URL__'.replace('{layer}', layer);

		const attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
		const streets = L.tileLayer(tileURL('osm'), { maxZoom: 19, attribution });
		const topo = L.tileLayer(tileURL('osm-topo'), { maxZoom: 17, attribution });

		const map = L.map('map', { layers: [streets] }).setView([38.9, -77.03], 12);

		L.control.layers({ 'Streets (osm)': streets, 'Topographic (osm-topo)': topo }).addTo(map);
	</script>
</body>

</html>
