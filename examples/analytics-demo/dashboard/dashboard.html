<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Analytics Demo - Dashboard</title>
	<style>
		:root { color-scheme: light dark; }
		body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6f8; color: #22303c; }
		header { padding: 0.75rem 1rem; background: #22303c; color: #fff; }
		header a { color: #8ecdf5; }
		main { padding: 1rem; display: grid; gap: 1rem; max-width: 60rem; margin: 0 auto; }
		.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 1rem; }
		.card { background: #fff; border: 1px solid #dde3e8; border-radius: 6px; padding: 0.75rem 1rem; }
		.card h2 { margin: 0 0 0.5rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #5c6b7a; }
		.stat { font-size: 1.8rem; font-variant-numeric: tabular-nums; }
		table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
		th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #eceff2; }
		th { color: #5c6b7a; font-weight: 600; }
		td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
		.bar { background: #4a90d9; height: 0.7rem; border-radius: 2px; }
		#error { color: #a3271f; }
		:where(body) { min-height: 100vh; }
	</style>
</head>

<body>
	<header>
		Tile usage recorded by tilegroxy, read straight out of postgres. Refreshes every 2 seconds.
		<a href="/">Back to the map</a>.
	</header>
	<main>
		<p id="error" hidden></p>
		<div class="tiles">
			<div class="card"><h2>Tiles served</h2><div class="stat" id="tiles">-</div></div>
			<div class="card"><h2>Layers used</h2><div class="stat" id="layers">-</div></div>
			<div class="card"><h2>Avg duration</h2><div class="stat" id="duration">-</div></div>
			<div class="card"><h2>Bytes served</h2><div class="stat" id="bytes">-</div></div>
		</div>

		<div class="card">
			<h2>By layer</h2>
			<table>
				<thead>
					<tr><th>Layer</th><th class="num">Tiles</th><th class="num">Avg ms</th><th>Last seen</th></tr>
				</thead>
				<tbody id="by-layer"></tbody>
			</table>
		</div>

		<div class="card">
			<h2>By zoom level</h2>
			<table><tbody id="by-zoom"></tbody></table>
		</div>

		<div class="card">
			<h2>Most recent events</h2>
			<table>
				<thead>
					<tr><th>Time</th><th>Layer</th><th>z/x/y</th><th>User</th><th>Extra</th></tr>
				</thead>
				<tbody id="recent"></tbody>
			</table>
		</div>
	</main>

	<script>
		const el = id => document.getElementById(id);
		const text = (value) => { const td = document.createElement('td'); td.textContent = value; return td; };
		const num = (value) => { const td = text(value); td.className = 'num'; return td; };

		const time = iso => new Date(iso).toLocaleTimeString();

		const bytes = n => {
			if (n < 1024) return `${n} B`;
			if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
			return `${(n / 1024 / 1024).toFixed(1)} MB`;
		};

		const fill = (tbody, rows, build) => {
			tbody.replaceChildren();
			for (const row of rows) {
				const tr = document.createElement('tr');
				for (const cell of build(row)) tr.append(cell);
				tbody.append(tr);
			}
		};

		async function refresh() {
			let stats;
			try {
				const resp = await fetch('/api/stats');
				stats = await resp.json();
				if (!resp.ok) throw new Error(stats.error || resp.statusText);
			} catch (err) {
				el('error').textContent = `Could not load stats: ${err.message}`;
				el('error').hidden = false;
				return;
			}
			el('error').hidden = true;

			el('tiles').textContent = stats.totals.tiles;
			el('layers').textContent = stats.totals.layers;
			el('duration').textContent = `${stats.totals.avg_duration_ms} ms`;
			el('bytes').textContent = bytes(Number(stats.totals.total_bytes));

			fill(el('by-layer'), stats.by_layer, row => [
				text(row.layer), num(row.tiles), num(row.avg_duration_ms), text(time(row.last_seen)),
			]);

			const busiest = Math.max(1, ...stats.by_zoom.map(r => r.tiles));
			fill(el('by-zoom'), stats.by_zoom, row => {
				const label = text(`z${row.z}`);
				const bar = document.createElement('td');
				const fillEl = document.createElement('div');
				fillEl.className = 'bar';
				fillEl.style.width = `${(row.tiles / busiest) * 100}%`;
				bar.append(fillEl);
				return [label, bar, num(row.tiles)];
			});

			fill(el('recent'), stats.recent, row => [
				text(time(row.time)), text(row.layer), text(`${row.z}/${row.x}/${row.y}`),
				text(row.user_id || 'anonymous'), text(JSON.stringify(row.extra)),
			]);
		}

		refresh();
		setInterval(refresh, 2000);
	</script>
</body>

</html>
